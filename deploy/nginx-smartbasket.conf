# Nginx para SmartOdds Basketball — VPS2 (212.227.50.152).
# El backend (uvicorn :8002) ya sirve TANTO el SPA como el API (/graphql, /status),
# asi que nginx es un reverse proxy simple. Certbot añade el bloque SSL (443).
#
# REQUISITO PREVIO: crear un registro DNS A
#   smartbasquet.masedamultiservicios.es  ->  212.227.50.152
# y luego:  certbot --nginx -d smartbasquet.masedamultiservicios.es

server {
    listen 80;
    server_name smartbasquet.masedamultiservicios.es;

    location / {
        proxy_pass http://127.0.0.1:8002;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
